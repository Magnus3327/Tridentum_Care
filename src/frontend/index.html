<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TridentumCare - Supporto e cura per anziani a Trento">
    <title>TridentumCare | Supporto per Anziani</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Nasconde Google Translate */
        .goog-te-banner-frame { display: none !important; }
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        iframe.goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
        html { top: 0px !important; }
        .goog-tooltip { display: none !important; }
        .goog-tooltip:hover { display: none !important; }
        #goog-gt-tt { display: none !important; }
        .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
        
        .flag-icon {
            transition: transform 0.2s, filter 0.2s;
            filter: grayscale(40%);
        }
        .flag-icon:hover {
            transform: scale(1.2);
            filter: grayscale(0%);
        }
    </style>
    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'it', includedLanguages: 'it,en,de,fr,es', autoDisplay: false}, 'google_translate_element');
        }
        function changeLanguage(lang) {
            var teCombo = document.querySelector('.goog-te-combo');
            if (teCombo) {
                teCombo.value = lang;
                teCombo.dispatchEvent(new Event('change'));
            } else {
                setTimeout(function() { changeLanguage(lang); }, 300);
            }
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>
    <div id="google_translate_element" style="position: absolute; width: 0; height: 0; overflow: hidden; top: -100px;"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container flex justify-between items-center">
            <a href="#" class="brand" onclick="navigateTo('home')">
                <i class="fa-solid fa-shield-heart text-secondary"></i>
                TRIDENTUM<span>CARE</span>
            </a>
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <div class="nav-links" id="dynamic-nav-links">
                    <!-- Injected via app.js -->
                </div>
                <!-- Language Selector -->
                <div class="lang-flags" style="display: flex; gap: 0.75rem; cursor: pointer; font-size: 1.5rem; border-left: 1px solid var(--border-color); padding-left: 1.5rem;">
                    <span class="flag-icon" onclick="changeLanguage('it')" title="Italiano">🇮🇹</span>
                    <span class="flag-icon" onclick="changeLanguage('en')" title="English">🇬🇧</span>
                    <span class="flag-icon" onclick="changeLanguage('de')" title="Deutsch">🇩🇪</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container for Views -->
    <main id="app-container" class="container">
        <!-- Views verranno caricate dinamicamente qui da app.js -->
    </main>

    <!-- Footer -->
    <footer style="margin-top: auto; padding: 2rem 0; background: var(--surface-color); border-top: 1px solid var(--border-color); text-align: center;">
        <div class="container">
            <p class="text-muted">&copy; 2026 TridentumCare. Tutti i diritti riservati.</p>
            <p style="font-size: 0.875rem;"><a href="#" class="text-muted">Privacy Policy</a> • <a href="#" class="text-muted">Termini di Servizio</a></p>
        </div>
    </footer>

    <script src="./main.js" defer></script>
</body>
</html>
