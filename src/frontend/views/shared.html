<!-- Profile & Settings -->
<section id="view-shared-profile" class="view-section">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
        <h2>Profilo Personale</h2>
        <form onsubmit="event.preventDefault(); alert('Profilo aggiornato!');">
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" value="Mario">
                </div>
                <div class="form-group">
                    <label class="form-label">Cognome</label>
                    <input type="text" class="form-control" value="Rossi">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" value="mario.rossi@email.it" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">Indirizzo Predefinito (Per velocizzare le richieste)</label>
                <input type="text" class="form-control" value="Via Roma 1, Trento">
            </div>
            
            <div class="flex gap-2" style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary">Salva Modifiche</button>
                <button type="button" class="btn btn-danger" onclick="openModal('delete-account-modal')">Elimina Account (GDPR)</button>
            </div>
        </form>
    </div>
    
    <!-- Delete Account Modal -->
    <div class="modal-overlay" id="delete-account-modal">
        <div class="modal-content text-center">
            <h2 class="text-danger">Attenzione!</h2>
            <p>Sei sicuro di voler richiedere l'eliminazione definitiva del tuo account e di tutti i dati associati (GDPR)? Questa azione è irreversibile.</p>
            <div class="flex gap-2 justify-center" style="margin-top: 2rem;">
                <button class="btn btn-outline" onclick="closeModal('delete-account-modal')">Annulla</button>
                <button class="btn btn-danger" onclick="alert('Richiesta inviata. Sarai disconnesso.'); navigateTo('home'); closeModal('delete-account-modal')">Conferma Eliminazione</button>
            </div>
        </div>
    </div>
</section>
