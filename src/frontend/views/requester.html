<!-- Dashboard "Le mie richieste" -->
<section id="view-req-dashboard" class="view-section accessible-view">
    <div class="flex justify-between items-center" style="margin-bottom: 2rem; gap: 1rem; flex-wrap: wrap;">
        <h2>Le Mie Richieste</h2>
        <button class="btn btn-secondary btn-large" onclick="navigateTo('req-form')">
            <i class="fa-solid fa-plus"></i> Nuova Richiesta
        </button>
    </div>

    <div id="requester-requests-container"></div>
</section>

<!-- Form Crea/Modifica Richiesta -->
<section id="view-req-form" class="view-section accessible-view">
    <button class="btn btn-outline" onclick="navigateTo('req-dashboard')" style="margin-bottom: 2rem;"><i class="fa-solid fa-arrow-left"></i> Torna Indietro</button>
    <div class="card">
        <h2>Crea Nuova Richiesta di Aiuto</h2>
        <form id="requester-form" onsubmit="createRequesterRequest(event)">
            <div class="form-group">
                <label class="form-label">Di cosa hai bisogno?</label>
                <select id="req-serviceType" class="form-control form-control-lg" required>
                    <option value="">Seleziona un servizio...</option>
                    <option value="Spesa a domicilio">Spesa a domicilio</option>
                    <option value="Ritiro farmaci">Ritiro farmaci</option>
                    <option value="Compagnia">Compagnia</option>
                    <option value="Trasporto medico">Trasporto medico</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Dove?</label>
                <input id="req-location" type="text" class="form-control form-control-lg" placeholder="Via Roma 1, Trento" required>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Data</label>
                    <input id="req-date" type="date" class="form-control form-control-lg" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Ora (indicativa)</label>
                    <input id="req-time" type="time" class="form-control form-control-lg" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Note aggiuntive (Opzionale)</label>
                <textarea id="req-notes" class="form-control form-control-lg" rows="3" placeholder="Es. Suonare il campanello Rossi..."></textarea>
            </div>
            <button type="submit" class="btn btn-secondary btn-large btn-block" style="margin-top: 2rem;">Invia Richiesta</button>
        </form>
    </div>
</section>

<!-- Dettaglio Richiesta -->
<section id="view-req-detail" class="view-section accessible-view">
    <button class="btn btn-outline" onclick="navigateTo('req-dashboard')" style="margin-bottom: 2rem;"><i class="fa-solid fa-arrow-left"></i> Torna Indietro</button>
    <div class="card">
        <div class="flex justify-between items-center" style="gap: 1rem; flex-wrap: wrap;">
            <span id="req-detail-status" class="badge badge-warning" style="font-size: 1.2rem; padding: 0.5rem 1rem;">Stato</span>
            <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                <button id="req-detail-cancel-btn" class="btn btn-danger" onclick="cancelRequesterRequest(window.currentRequesterRequestId)">Annulla Richiesta</button>
                <button id="req-detail-complete-btn" class="btn btn-primary" onclick="updateRequesterStatus(window.currentRequesterRequestId, 'Completata')">Segna come Completata</button>
            </div>
        </div>
        <h1 id="req-detail-title" style="margin-top: 1rem;">Titolo richiesta</h1>
        
        <div style="margin: 2rem 0; font-size: 1.1rem; background: #f8f9fa; padding: 1.5rem; border-radius: var(--radius-md);">
            <p><strong><i class="fa-regular fa-calendar"></i> Data:</strong> <span id="req-detail-date"></span></p>
            <p><strong><i class="fa-regular fa-clock"></i> Ora:</strong> <span id="req-detail-time"></span></p>
            <p><strong><i class="fa-solid fa-location-dot"></i> Luogo:</strong> <span id="req-detail-location"></span></p>
            <p><strong><i class="fa-solid fa-circle-info"></i> Note:</strong> <span id="req-detail-notes"></span></p>
        </div>
    </div>
</section>
