<section id="view-admin-dash" class="view-section">
    <h2>Console Admin</h2>

    <div class="grid-2" style="margin-top: 2rem; gap: 1.5rem;">
        <div class="card">
            <h3>Ricerca e Moderazione Utenti</h3>
            <div class="flex gap-1" style="margin: 1rem 0;">
                <input id="admin-user-search" type="text" class="form-control" placeholder="Cerca per email o nome...">
                <button type="button" class="btn btn-primary" onclick="searchAdminUsers()">Cerca</button>
            </div>
            <div class="flex gap-1" style="margin-bottom: 1rem;">
                <select id="admin-user-role-filter" class="form-control">
                    <option value="">Tutti i ruoli</option>
                    <option value="volunteer">Volontario</option>
                    <option value="requester">Richiedente</option>
                    <option value="partner">Partner</option>
                </select>
            </div>
            <div class="flex justify-between items-center" style="margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap;">
                <div>
                    <span id="admin-users-count" class="text-bold">0 utenti</span>
                    <small id="admin-summary-badge" class="text-muted"> </small>
                </div>
            </div>
            <div id="admin-users-results"></div>
        </div>

        <div class="card" id="admin-partner-section">
            <h3>Registra Nuovo Partner</h3>
            <p class="text-muted" style="margin-bottom: 1rem;">Solo gli amministratori possono creare partner.</p>
            <form id="admin-partner-form">
                <div class="form-group">
                    <label class="form-label">Nome Attività</label>
                    <input id="admin-partner-legal-form" type="text" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Referente</label>
                    <input id="admin-partner-email" type="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Nome Referente</label>
                    <input id="admin-partner-name" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Cognome Referente</label>
                    <input id="admin-partner-surname" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Telefono</label>
                    <input id="admin-partner-phone" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Indirizzo</label>
                    <input id="admin-partner-address" type="text" class="form-control">
                </div>
                <button id="admin-partner-submit" type="submit" class="btn btn-secondary btn-block">Genera e Invia Accesso</button>
            </form>
            <p id="admin-partner-note" class="text-muted" style="margin-top: 0.75rem;">Solo gli amministratori possono registrare partner.</p>
        </div>
    </div>

    <style>
        /* Forza la visualizzazione SOLO quando la classe attiva viene iniettata dal router */
        #view-admin-dash.active {
            display: block !important;
        }
    </style>
</section>
