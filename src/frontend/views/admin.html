<section id="view-admin-dash" class="view-section">
    <h2>Console Admin</h2>

    <div class="grid-2" style="margin-top: 2rem; gap: 1.5rem;">
        <div class="card">
            <h3>Ricerca e Moderazione Utenti</h3>
            <div class="flex gap-1" style="margin: 1rem 0;">
                <input id="admin-user-search" type="text" class="form-control" placeholder="Cerca per email o nome...">
                <button type="button" class="btn btn-primary" onclick="searchAdminUsers()">Cerca</button>
            </div>
            <div class="flex gap-1" style="margin-bottom: 1rem;">
                <select id="admin-user-role-filter" class="form-control">
                    <option value="">Tutti i ruoli</option>
                    <option value="volunteer">Volontario</option>
                    <option value="requester">Richiedente</option>
                    <option value="partner">Partner</option>
                </select>
            </div>
            <div class="flex justify-between items-center" style="margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap;">
                <div>
                    <span id="admin-users-count" class="text-bold">0 utenti</span>
                    <small id="admin-summary-badge" class="text-muted"> </small>
                </div>
            </div>
            <div id="admin-users-results"></div>
        </div>

        <div class="card" id="admin-partner-section">
            <h3>Registra Nuovo Partner</h3>
            <p class="text-muted" style="margin-bottom: 1rem;">Solo gli amministratori possono creare partner.</p>
            <form id="admin-partner-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input id="admin-partner-email" type="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input id="admin-partner-password" type="password" class="form-control" required minlength="6">
                </div>
                <button id="admin-partner-submit" type="submit" class="btn btn-secondary btn-block">Crea Partner</button>
            </form>
        </div>
    </div>

    <!-- Modale credenziali partner -->
    <div id="partner-credentials-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 550px;">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <i class="fa-solid fa-lock text-primary" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                <h3 style="color: var(--primary-color);">Credenziali Partner Generate</h3>
                <p class="text-muted">Fornisci queste credenziali al partner per il primo accesso. <br>Verrà richiesto loro di cambiare la password al primo login.</p>
            </div>
            
            <div style="background: var(--background-light); padding: 1.5rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); margin-bottom: 1.5rem;">
                <div style="margin-bottom: 1rem;">
                    <label class="form-label" style="font-size: 0.9rem; color: var(--text-muted);">Email (Utente):</label>
                    <div style="font-weight: 600; font-size: 1.1rem; user-select: all;" id="partner-cred-email"></div>
                </div>
                <div>
                    <label class="form-label" style="font-size: 0.9rem; color: var(--text-muted);">Password Temporanea:</label>
                    <div class="flex" style="gap: 0.5rem; align-items: center;">
                        <input type="text" id="partner-cred-password" class="form-control" readonly style="font-family: monospace; font-size: 1.2rem; font-weight: bold; background: white; flex: 1;">
                        <button type="button" class="btn btn-primary" onclick="copyPartnerCredentials()" style="padding: 0.75rem 1rem;" title="Copia Password">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <button type="button" class="btn btn-secondary btn-block" onclick="closePartnerCredentialsModal()">Ho salvato le credenziali</button>
        </div>
    </div>

    <style>
        /* Forza la visualizzazione SOLO quando la classe attiva viene iniettata dal router */
        #view-admin-dash.active {
            display: block !important;
        }
    </style>
</section>
