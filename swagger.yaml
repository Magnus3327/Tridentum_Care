        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Partners
      summary: Create a new coupon
      description: Defines a new reward coupon to be visible in the volunteer store.
      security:
        - bearerAuth: []
      x-role-required: partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - pointsCost
                - expirationDate
              properties:
                title:
                  type: string
                description:
                  type: string
                pointsCost:
                  type: integer
                expirationDate:
                  type: string
