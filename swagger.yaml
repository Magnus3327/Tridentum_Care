          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /constants:
    get:
      tags:
        - System
      summary: Get system constants
      description: Returns enums and configuration variables used by the frontend.
      security: []
      responses:
        '200':
          description: System constants returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  SERVICES:
                    type: array
                    items:
                      type: string
                  ROLES:
                    type: object
                  REQUEST_STATUS:
                    type: object
                  AUTH_LVL:
                    type: object
                  DEFAULT_POINTS:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        id:
          type: string
        name:
          type: string
        surname:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [requester, volunteer, partner]
        phone:
          type: string
        address:
          type: string
        createdAt:
          type: string
          format: date-time
        authLvl:
          type: integer
          enum: [0, 1, 2]
        points:
          type: integer
        skills:
          type: array
          items:
            type: string
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/OwnedCoupon'
        age:
          type: integer
        gender:
          type: string
        license:
          type: string
        isSuspended:
          type: boolean
        suspendedUntil:
          type: string
          format: date-time

    Request:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        serviceType:
          type: string
        category:
          type: string
        title:
          type: string
        location:
          type: string
        address:
          type: string
        date:
          type: string
        time:
          type: string
        dateTime:
          type: string
        notes:
          type: string
        description:
          type: string
        points:
          type: integer
        status:
          type: string
          enum:
            - In Attesa di Volontario
            - In Corso
            - Completata
            - Annullata
        volunteerId:
          type: string
          nullable: true
        requesterName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    Coupon:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        pointsCost:
          type: integer
        expirationDate:
          type: string
        partnerId:
          type: string

    OwnedCoupon:
      type: object
      properties:
        name:
          type: string
        cost:
          type: integer
        code:
          type: string
        acquiredAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserPublic'

    UserPublic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        surname:
          type: string
        email:
          type: string
        role:
          type: string
        points:
          type: integer
        authLvl:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      properties:
        message:
          type: string

    RegistrationRequest:
      type: object
      required:
        - email
        - password
        - role
      properties:
        name:
          type: string
        surname:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [requester, volunteer]
        age:
          type: integer
          minimum: 18
        gender:
          type: string
        license:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    VolunteerProfileUpdate:
      type: object
      properties:
        name:
          type: string
        surname:
          type: string
        address:
          type: string
        phone:
          type: string
        skills:
          type: array
          items:
            type: string
        age:
          type: integer
          minimum: 18
        license:
          type: string
        gender:
          type: string
