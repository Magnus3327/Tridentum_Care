components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        id:
          type: string
        name:
          type: string
        surname:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [requester, volunteer, partner]
        phone:
          type: string
        address:
          type: string
        createdAt:
          type: string
          format: date-time
        authLvl:
          type: integer
          enum: [0, 1, 2]
        points:
          type: integer
        skills:
          type: array
          items:
            type: string
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/OwnedCoupon'
        age:
          type: integer
        gender:
          type: string
        license:
          type: string
        isSuspended:
          type: boolean
        suspendedUntil:
          type: string
          format: date-time

    Request:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        serviceType:
          type: string
        category:
          type: string
        title:
          type: string
        location:
          type: string
        address:
          type: string
        date:
          type: string
        time:
          type: string
        dateTime:
          type: string
        notes:
          type: string
        description:
          type: string
        points:
          type: integer
        status:
          type: string
          enum:
            - In Attesa di Volontario
            - In Corso
            - Completata
            - Annullata
        volunteerId:
          type: string
          nullable: true
        requesterName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    Coupon:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        pointsCost:
          type: integer
        expirationDate:
          type: string
        partnerId:
