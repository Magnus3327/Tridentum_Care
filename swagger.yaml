openapi: 3.0.3
info:
  title: Tridentum Care API
  description: "Documentazione API per Tridentum Care, piattaforma di coordinamento dei volontari della città di Trento."
  version: 1.0.0
servers:
  - url: https://tridentum-care.onrender.com/api/v1
    description: "Sviluppo locale"
tags:
  - name: Authentication
    description: "Registrazione utenti e gestione sessioni"
  - name: Volunteers
    description: "Profili dei volontari, attività e buoni negozio"
  - name: Requests
    description: "Scheda richieste globali e incarichi"
  - name: Requesters
    description: "Creazione profili cittadini e richieste di servizi"
  - name: Administrators
    description: "Gestione degli utenti e moderazione del sistema"
  - name: Partners
    description: "Profili dei partner e creazione di coupon"
  - name: System
    description: "Stato e configurazioni del sistema"
paths:
  /auth/registrations:
    post:
      tags:
        - Authentication
      summary: "Registra un nuovo utente"
      description: "Crea un nuovo account utente. I ruoli di volontario richiedono un'età >= 18 anni."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: "Registrazione riuscita"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: "Convalida non riuscita o e-mail già registrata"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/sessions:
    post:
      tags:
        - Authentication
      summary: "Accedi per ottenere un token di sessione JWT"
      description: "Autentica un utente utilizzando email e password, restituendo un token JWT valido per 24 ore."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "Accesso riuscito"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: "Email o password mancanti"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Credenziali non valide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Conto sospeso"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: "Ottieni l'utente autenticato corrente"
      description: "Restituisce il profilo dell'utente attualmente connesso indipendentemente dal ruolo."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Profilo utente recuperato correttamente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Utente non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /volunteers/me:
    get:
      tags:
        - Volunteers
      summary: "Ottieni il profilo del volontario"
      description: "Restituisce il profilo completo del volontario autenticato, inclusi competenze, punti e coupon acquisiti."
      security:
        - bearerAuth: []
      x-role-required: volunteer
      responses:
        '200':
          description: "Profilo del volontario recuperato con successo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Proibito (ruolo sbagliato)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Volontario non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Volunteers
      summary: "Aggiorna il profilo del volontario"
      description: "Aggiorna informazioni e competenze personali. authLvl non può essere modificato qui."
      security:
        - bearerAuth: []
      x-role-required: volunteer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolunteerProfileUpdate'
      responses:
        '200':
          description: "Profilo aggiornato con successo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: "Errore di convalida (ad esempio, età < 18)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Utente non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Volunteers
      summary: "Elimina il profilo del volontario"
      description: "Cancellazione conforme al GDPR. Reimposta le richieste \"In Corso\", anonimizza gli altri ed elimina il documento utente."
      security:
        - bearerAuth: []
      x-role-required: volunteer
      responses:
        '200':
          description: "Profilo eliminato con successo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Utente non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /volunteers/coupons:
    get:
      tags:
        - Volunteers
      summary: "Ottieni i coupon del negozio disponibili"
      description: "Restituisce tutti i coupon che non sono ancora scaduti."
      security:
        - bearerAuth: []
      x-role-required: volunteer
      responses:
        '200':
          description: "Elenco dei coupon attivi"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coupon'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /volunteers/coupons/redemptions:
    post:
      tags:
        - Volunteers
      summary: "Riscatta un buono"
      description: "Detrae punti dal volontario e garantisce un codice coupon univoco."
      security:
        - bearerAuth: []
      x-role-required: volunteer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - couponId
              properties:
                couponId:
                  type: string
                  description: "L'ID del coupon da riscattare"
      responses:
        '200':
          description: "Coupon riscattato con successo"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  newPoints:
                    type: integer
        '400':
          description: "Punti insufficienti o couponId mancante"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Coupon o utente non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /volunteers/me/tasks:
    get:
      tags:
        - Volunteers
      summary: "Ottieni i compiti assegnati al volontario"
      description: "Restituisce tutte le richieste attualmente assegnate al volontario autenticato con stato \"In Corso\", ordinate per data di creazione decrescente."
      security:
        - bearerAuth: []
      x-role-required: volunteer
      responses:
        '200':
          description: "Elenco delle attività assegnate recuperate correttamente"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Proibito (ruolo sbagliato)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Volontario non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                
  /requests:
    get:
      tags:
        - Requests
      summary: "Ottieni la bacheca delle richieste attive"
      description: "Restituisce le richieste disponibili (\"In Attesa di Volontario\"), filtrate per competenze del volontario a meno che authLvl >= MODERATORE."
      security:
        - bearerAuth: []
      x-role-required: volunteer
      parameters:
        - in: query
          name: category
          schema:
            type: string
          required: false
          description: "Filtra le richieste per categoria di servizio specifica"
      responses:
        '200':
          description: "Elenco delle richieste attive"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /requests/{id}/assignments:
    post:
      tags:
        - Requests
      summary: "Accetta una richiesta"
      description: "Assegna la richiesta specificata al volontario autenticato."
      security:
        - bearerAuth: []
      x-role-required: volunteer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "ID della richiesta da accettare"
      responses:
        '200':
          description: "Richiesta accettata con successo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: "Richiesta non disponibile o già assegnata"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Volontario non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Requests
      summary: "Annullare l'assegnazione di una richiesta"
      description: "Il volontario rilascia alla lavagna una richiesta accettata."
      security:
        - bearerAuth: []
      x-role-required: volunteer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "ID della richiesta di rilascio"
      responses:
        '200':
          description: "Compito annullato correttamente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Compito non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /requesters/me:
    get:
      tags:
        - Requesters
      summary: "Ottieni il profilo del richiedente"
      description: "Restituisce i dati del profilo del richiedente autenticato."
      security:
        - bearerAuth: []
      x-role-required: requester
      responses:
        '200':
          description: "Profilo recuperato con successo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Utente non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Requesters
      summary: "Aggiorna il profilo del richiedente"
      description: "Modifica i dati personali."
      security:
        - bearerAuth: []
      x-role-required: requester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - surname
              properties:
                name:
                  type: string
                surname:
                  type: string
                phone:
                  type: string
                address:
                  type: string
      responses:
        '200':
          description: "Profilo aggiornato con successo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: "Errore di convalida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Utente non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Requesters
      summary: "Elimina il profilo del richiedente"
      description: "Cancellazione conforme al GDPR. Elimina permanentemente il profilo del richiedente e tutte le relative richieste di servizio."
      security:
        - bearerAuth: []
      x-role-required: requester
      responses:
        '200':
          description: "Profilo e richieste eliminati correttamente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Utente non trovato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /requesters/requests:
    get:
      tags:
        - Requesters
      summary: "Ricevi le tue richieste di servizio"
      description: "Restituisce tutte le richieste create dal richiedente autenticato."
      security:
        - bearerAuth: []
      x-role-required: requester
      responses:
        '200':
          description: "Elenco delle richieste di servizio del richiedente"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Requesters
      summary: "Crea una nuova richiesta di servizio"
      description: "Crea una nuova richiesta di servizio che verrà pubblicata per i volontari."
      security:
        - bearerAuth: []
      x-role-required: requester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serviceType
                - location
                - date
                - time
              properties:
                serviceType:
                  type: string
                location:
                  type: string
                date:
                  type: string
                  example: "2024-12-31"
                time:
                  type: string
                  example: "14:30"
                notes:
                  type: string
      responses:
        '201':
          description: "Richiesta creata con successo"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  requestId:
                    type: string
        '400':
          description: "Errore di convalida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /requesters/requests/{requestId}:
    put:
      tags:
        - Requesters
      summary: "Aggiorna una richiesta di servizio"
      description: "Aggiorna completamente una richiesta di servizio, solo se è ancora pendente (\"In Attesa di Volontario\")."
      security:
        - bearerAuth: []
      x-role-required: requester
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serviceType
                - location
                - date
                - time
              properties:
                serviceType:
                  type: string
                location:
                  type: string
                date:
                  type: string
                time:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: "Richiesta aggiornata con successo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: "Impossibile modificare la richiesta"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Richiesta non trovata o non posseduta"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Requesters
      summary: "Aggiorna parzialmente lo stato di una richiesta di servizio"
      description: "Aggiorna solo il campo stato. Se contrassegnato come \"Completata\", i punti vengono assegnati al volontario."
      security:
        - bearerAuth: []
      x-role-required: requester
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - In Attesa di Volontario
                    - In Corso
                    - Completata
                    - Annullata
      responses:
        '200':
          description: "Stato aggiornato con successo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: "Stato non valido"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Non autorizzato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Vietato"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Richiesta non trovata"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Errore interno del server"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Requesters
